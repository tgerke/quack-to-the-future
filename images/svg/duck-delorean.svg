<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="A duck with 80s sunglasses leaving fire trails">
  <defs>
    <linearGradient id="flame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f25c05" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#f25c05"/>
      <stop offset="0.75" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#fff6d6"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- fire trails -->
  <g filter="url(#glow)">
    <path d="M10 236 Q140 228 236 233 L232 245 Q130 243 12 248 Z" fill="url(#flame)"/>
    <path d="M30 262 Q160 254 268 258 L264 270 Q150 269 32 274 Z" fill="url(#flame)"/>
  </g>

  <!-- duck -->
  <g>
    <!-- body -->
    <path d="M232 232 q-6 -50 40 -70 q-14 -18 -8 -42 q8 -34 46 -36 q34 -2 48 26 q8 16 2 34 l38 4 q14 2 6 14 q-16 22 -44 26 q30 8 44 30 q16 26 -2 46 q-22 22 -76 22 q-70 0 -94 -54 Z" fill="url(#body)"/>
    <!-- wing -->
    <path d="M300 210 q34 -12 52 8 q-16 26 -52 18 q-12 -12 0 -26 Z" fill="#f28c1c" opacity="0.85"/>
    <!-- beak -->
    <path d="M354 118 l40 6 q12 2 5 12 q-12 16 -34 18 q-16 -16 -11 -36 Z" fill="#f25c05"/>
    <!-- sunglasses -->
    <g>
      <rect x="296" y="96" width="34" height="22" rx="6" fill="#12142a"/>
      <rect x="338" y="98" width="26" height="20" rx="6" fill="#12142a"/>
      <path d="M296 104 h-14" stroke="#12142a" stroke-width="5" stroke-linecap="round"/>
      <path d="M330 104 h8" stroke="#12142a" stroke-width="5"/>
      <path d="M300 101 h24" stroke="#4cc9f0" stroke-width="3" opacity="0.8"/>
      <path d="M341 103 h18" stroke="#4cc9f0" stroke-width="3" opacity="0.8"/>
    </g>
  </g>
</svg>
