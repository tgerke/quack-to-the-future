<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Medallion architecture: bronze, silver, gold layers">
  <defs>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0975a"/><stop offset="1" stop-color="#9c5a24"/>
    </linearGradient>
    <linearGradient id="silverg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6e9ef"/><stop offset="1" stop-color="#9aa1ad"/>
    </linearGradient>
    <linearGradient id="goldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#d9a900"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a90ad"/>
    </marker>
  </defs>

  <g font-family="'Atkinson Hyperlegible',sans-serif" text-anchor="middle">
    <!-- bronze -->
    <rect x="30" y="120" width="240" height="150" rx="18" fill="url(#bronze)"/>
    <text x="150" y="180" font-size="34" font-weight="700" fill="#2b1608">Bronze</text>
    <text x="150" y="218" font-size="20" fill="#3d2410">raw, as received</text>
    <text x="150" y="244" font-size="20" fill="#3d2410">nothing edited, ever</text>
    <text x="150" y="318" font-size="19" fill="#8a90ad" font-family="'Fira Code',monospace">bronze.vehicles</text>

    <!-- silver -->
    <rect x="330" y="120" width="240" height="150" rx="18" fill="url(#silverg)"/>
    <text x="450" y="180" font-size="34" font-weight="700" fill="#20242c">Silver</text>
    <text x="450" y="218" font-size="20" fill="#343a45">cleaned &amp; conformed</text>
    <text x="450" y="244" font-size="20" fill="#343a45">types, names, dedup</text>
    <text x="450" y="318" font-size="19" fill="#8a90ad" font-family="'Fira Code',monospace">silver.vehicles</text>

    <!-- gold -->
    <rect x="630" y="120" width="240" height="150" rx="18" fill="url(#goldg)"/>
    <text x="750" y="180" font-size="34" font-weight="700" fill="#3d2e00">Gold</text>
    <text x="750" y="218" font-size="20" fill="#4d3a00">analysis-ready</text>
    <text x="750" y="244" font-size="20" fill="#4d3a00">business logic applied</text>
    <text x="750" y="318" font-size="19" fill="#8a90ad" font-family="'Fira Code',monospace">gold.efficiency_by_cyl</text>

    <!-- arrows -->
    <path d="M275 195 L322 195" stroke="#8a90ad" stroke-width="5" marker-end="url(#arr)"/>
    <path d="M575 195 L622 195" stroke="#8a90ad" stroke-width="5" marker-end="url(#arr)"/>

    <text x="450" y="70" font-size="24" fill="#8a90ad">each hop is one versioned, documented transaction</text>
  </g>
</svg>
